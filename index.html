<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="accountBox" class="account-box"></div>

    <h1>Welcome to GameHub</h1>

    <p>Find out which games your PC can run.</p>

    <input type="text" id="gameSearch" placeholder="search for a game...">

    <br><br>

    <button id="navCheckPC">Check My PC</button>
    <button id="navBrowseGames">Browse Games</button>

    <h2 id="checker">Check Your PC</h2>

    <div class="pc-checker">

        <select id="gameSelect">
            <option value="">Select a game</option>
        </select>

        <input type="text" id="cpuInput" list="cpuList" placeholder="Type or pick your CPU..." autocomplete="off">
        <datalist id="cpuList"></datalist>

        <select id="ram">
            <option value="">Select your RAM</option>
            <option value="1">1 GB RAM</option>
            <option value="2">2 GB RAM</option>
            <option value="3">3 GB RAM</option>
            <option value="4">4 GB RAM</option>
            <option value="6">6 GB RAM</option>
            <option value="8">8 GB RAM</option>
            <option value="12">12 GB RAM</option>
            <option value="16">16 GB RAM</option>
            <option value="24">24 GB RAM</option>
            <option value="32">32 GB RAM</option>
            <option value="48">48 GB RAM</option>
            <option value="64">64 GB RAM or more</option>
        </select>

        <input type="text" id="gpuInput" list="gpuList" placeholder="Type or pick your GPU..." autocomplete="off">
        <datalist id="gpuList"></datalist>

        <button id="checkPC">Check Compatibility</button>

        <p id="result"></p>
        <div id="gameDetails" class="game-details"></div>

    </div>

    <h2 id="myRig">Games Your PC Can Run</h2>

    <div id="rigResults" class="rig-results"></div>

    <h2 id="freeGames">Play Free Now</h2>

    <p class="section-hint">Free-to-play games that run forever &mdash; no card needed.
        Badges show whether <strong>your saved PC</strong> can handle them.</p>

    <div id="freeGrid" class="rig-grid"></div>

    <h2 id="giveaways">Live Giveaways</h2>

    <div id="giveawayGrid" class="rig-grid"></div>

    <h2 id="featured">Featured Games</h2>

    <div class="games" id="gamesGrid"></div>

    <script src="data-hardware.js"></script>
    <script src="data-games.js"></script>
    <script src="checker-core.js"></script>
    <script src="data-freegames.js"></script>
    <script src="affiliate.js"></script>
    <script src="auth-ui.js"></script>
    <script src="script.js"></script>

</body>
</html>
